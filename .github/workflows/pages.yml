# ---------------------------------------------------------------------------
# Зеркало CornFlow на GitHub Pages.
#
# Vercel остаётся основным деплоем и превью-окружением, но его адреса из
# России режутся. Этот workflow собирает тот же самый бандл и выкладывает его
# на Pages — домен cornflow.me смотрит сюда.
#
# Перед первым запуском нужно один раз:
#   1. Settings → Pages → Build and deployment → Source: GitHub Actions
#   2. Settings → Secrets and variables → Actions → Variables → New variable:
#        VITE_SUPABASE_URL       — тот же URL, что стоит в переменных Vercel
#        VITE_SUPABASE_ANON_KEY  — тот же anon-ключ (он и так уезжает в браузер)
#        VITE_SUPABASE_BUCKET    — materials  (необязательно, это значение по умолчанию)
# ---------------------------------------------------------------------------
name: Zerkalo na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Держим одну выкладку за раз, свежий пуш отменяет предыдущую сборку
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Без ключей Vite соберёт приложение в mock-режиме: интерфейс откроется,
      # но данных не будет. Лучше упасть здесь, чем выложить пустое зеркало.
      - name: Proveryaem peremennye
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Ne zadany peremennye VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY."
            echo "::error::Settings -> Secrets and variables -> Actions -> Variables"
            exit 1
          fi

      - run: npm ci

      - name: Sborka
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_BUCKET: ${{ vars.VITE_SUPABASE_BUCKET || 'materials' }}
        run: npm run build

      # SPA-роутинг: Pages не умеет rewrites, поэтому любой неизвестный путь
      # отдаём тем же index.html — иначе /app/gradebook даст 404 при перезагрузке.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
