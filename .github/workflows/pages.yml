# ---------------------------------------------------------------------------
# Зеркало CornFlow на GitHub Pages.
#
# Vercel остаётся основным деплоем и превью-окружением, но его адреса из
# России режутся. Этот workflow собирает тот же самый бандл и выкладывает его
# на Pages — домен cornflow.me смотрит сюда.
#
# Перед первым запуском нужно один раз:
#   1. Settings → Pages → Build and deployment → Source: GitHub Actions
#   2. Settings → Secrets and variables → Actions → Variables → New variable:
#        VITE_SUPABASE_URL       — тот же URL, что стоит в переменных Vercel
#        VITE_SUPABASE_ANON_KEY  — тот же anon-ключ (он и так уезжает в браузер)
#        VITE_SUPABASE_BUCKET    — materials  (необязательно, это значение по умолчанию)
# ---------------------------------------------------------------------------
name: Zerkalo na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Держим одну выкладку за раз, свежий пуш отменяет предыдущую сборку
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Без ключей Vite соберёт приложение в mock-режиме: интерфейс откроется,
      # но данных не будет. Лучше упасть здесь, чем выложить пустое зеркало.
      #
      # Основной формат — две переменные. Если вместо них заведён один блок
      # KEYS со строками вида VITE_SUPABASE_URL=... — разбираем и его.
      - name: Peremennye
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          BUCKET: ${{ vars.VITE_SUPABASE_BUCKET }}
          KEYS: ${{ vars.KEYS }}
        run: |
          if [ -n "$KEYS" ]; then
            while IFS= read -r line; do
              line="$(printf '%s' "$line" | tr -d '\r')"
              case "$line" in
                VITE_SUPABASE_URL=*)      [ -z "$URL" ]    && URL="${line#*=}" ;;
                VITE_SUPABASE_ANON_KEY=*) [ -z "$KEY" ]    && KEY="${line#*=}" ;;
                VITE_SUPABASE_BUCKET=*)   [ -z "$BUCKET" ] && BUCKET="${line#*=}" ;;
              esac
            done < <(printf '%s\n' "$KEYS")
          fi

          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Ne zadany VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY."
            echo "::error::Settings -> Secrets and variables -> Actions -> Variables"
            exit 1
          fi

          # Ловим случай, когда вместо значения вставлено имя переменной
          if [ "$KEY" = "VITE_SUPABASE_ANON_KEY" ] || [ ${#KEY} -lt 20 ]; then
            echo "::error::VITE_SUPABASE_ANON_KEY pohozh na zaglushku, a ne na klyuch."
            echo "::error::Supabase -> Settings -> API Keys -> anon / publishable"
            exit 1
          fi

          case "$URL" in
            https://*.supabase.co*) ;;
            *) echo "::error::VITE_SUPABASE_URL dolzhen byt vida https://<project>.supabase.co"; exit 1 ;;
          esac

          {
            echo "VITE_SUPABASE_URL=$URL"
            echo "VITE_SUPABASE_ANON_KEY=$KEY"
            echo "VITE_SUPABASE_BUCKET=${BUCKET:-materials}"
          } >> "$GITHUB_ENV"

      - run: npm ci

      # Значения уже в окружении job — их положил предыдущий шаг
      - name: Sborka
        run: npm run build

      # SPA-роутинг: Pages не умеет rewrites, поэтому любой неизвестный путь
      # отдаём тем же index.html — иначе /app/gradebook даст 404 при перезагрузке.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
